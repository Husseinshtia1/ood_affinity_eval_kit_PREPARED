name: PREPARED SaaS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  api-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API dependencies
        run: pip install -r requirements-api.txt
      - name: Import FastAPI app
        run: python -c "from apps.api.main import app; print(app.title)"

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/prepared-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
