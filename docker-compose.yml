services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - .env.example
    ports:
      - '8000:8000'
    volumes:
      - prepared_storage:/tmp/prepared_jobs
    depends_on:
      - redis
      - postgres

  redis:
    image: redis:7

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: prepared
      POSTGRES_USER: prepared
      POSTGRES_PASSWORD: prepared
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - .env.example
    volumes:
      - prepared_storage:/tmp/prepared_jobs
    depends_on:
      - redis
      - postgres

volumes:
  prepared_storage:
  postgres_data:
